[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-pdf-report-generator"
version = "1.0.0"
description = "Automated Python application for fetching data and generating PDF reports."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "requests",
    "reportlab",
    "apscheduler"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov"
]

[project.scripts]
report-generator = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:"
]